version: '3.8'

services:
  # Banco interno leve apenas para a persistência de sessões e instâncias da Evolution Go
  evolution_db:
    image: postgres:16-alpine
    container_name: evolution_db
    restart: always
    environment:
      POSTGRES_USER: ${EVO_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD:-evolution_secret_password}
      POSTGRES_MULTIPLE_DATABASES: evogo_auth,evogo_users
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - evolution_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Motor WhatsApp em Go (WhatsApp Engine)
  evolution_go:
    image: evolutionapi/evolution-go:latest
    container_name: evolution_go
    restart: always
    depends_on:
      evolution_db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: ${CLIENT_NAME:-evolution_crm}
      GLOBAL_API_KEY: ${GLOBAL_API_KEY:-CHANGE_ME_TO_A_VERY_SECURE_KEY}
      POSTGRES_AUTH_DB: "postgresql://${EVO_DB_USER:-postgres}:${EVO_DB_PASSWORD:-evolution_secret_password}@evolution_db:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://${EVO_DB_USER:-postgres}:${EVO_DB_PASSWORD:-evolution_secret_password}@evolution_db:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false" # O histórico de mensagens fica no nosso Supabase/CRM, poupando a VPS
      WADEBUG: "INFO"
      LOGTYPE: "console"
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_GLOBAL_URL:-http://host.docker.internal:8787/webhook}
      WEBHOOK_GLOBAL_ENABLED: "true"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution_net

volumes:
  evolution_db_data:
  evolution_instances:

networks:
  evolution_net:
    driver: bridge
